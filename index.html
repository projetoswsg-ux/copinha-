<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Crypto Journey - Mobile Portrait</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Bloqueio de scroll e ajuste para mobile */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0e11;
            font-family: 'Inter', sans-serif;
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* TELA DE MAPA - OTIMIZADA PARA RETRATO */
        #map-screen {
            flex: 1;
            /* Imagem de campo de futebol em perspectiva vertical (Portrait) */
            background-image: 
                linear-gradient(to bottom, rgba(11, 14, 17, 0.9), rgba(11, 14, 17, 0.4), rgba(11, 14, 17, 0.9)),
                url('https://images.unsplash.com/photo-1522778119026-d647f0596c20?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center bottom;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 40px;
        }

        /* Aviso de Orientação */
        #orientation-warning {
            display: none;
            position: fixed;
            inset: 0;
            background: #0b0e11;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #f0b90b;
            padding: 20px;
        }

        /* Media query para detectar modo paisagem em telemóveis */
        @media (orientation: landscape) and (max-height: 500px) {
            #orientation-warning { display: flex; }
        }

        .journey-container {
            position: relative;
            width: 92%;
            max-width: 400px;
            min-height: 1650px; 
            padding: 40px 0;
            background: rgba(0, 0, 0, 0.5);
            margin-top: 20px;
            border-radius: 40px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .tactic-line {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                transparent,
                transparent 10px,
                rgba(240, 185, 11, 0.4) 10px,
                rgba(240, 185, 11, 0.4) 20px
            );
            transform: translateX(-50%);
        }

        .level-wrapper {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            width: 100px;
        }

        .level-node {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 3px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            background-size: cover;
            background-position: center;
        }

        .level-info {
            margin-top: 6px;
            text-align: center;
        }

        .level-title {
            font-weight: 800;
            font-size: 9px;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .level-number {
            font-weight: 900;
            font-size: 14px;
            color: #f0b90b;
        }

        .level-current .level-node {
            transform: scale(1.15);
            border-color: #f0b90b;
            animation: pulse-gold 2s infinite;
        }

        .level-locked .level-node {
            filter: grayscale(1) brightness(0.3);
            border-color: #222;
        }

        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(240, 185, 11, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(240, 185, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(240, 185, 11, 0); }
        }

        /* Posicionamento Sinuoso Otimizado para Mobile Estreito */
        .node-left { left: 12%; }
        .node-center { left: 50%; transform: translateX(-50%); }
        .node-right { right: 12%; }

        /* Esconder barra de scroll mas manter funcionalidade */
        #map-screen::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

<!-- Aviso de modo paisagem -->
<div id="orientation-warning">
    <div class="text-5xl mb-4">📱</div>
    <h2 class="text-xl font-bold uppercase italic">Por favor, rode o dispositivo</h2>
    <p class="text-sm opacity-70 mt-2">Este jogo foi desenhado para ser jogado em modo Retrato.</p>
</div>

<div id="game-wrapper">
    <div id="map-screen">
        <div class="z-20 text-center px-4 mt-10">
            <h1 style="color: #f0b90b;" class="text-4xl font-black italic tracking-tighter uppercase leading-none">Temporada</h1>
            <p class="text-white font-bold text-[10px] uppercase tracking-[0.4em] mt-2 opacity-80">Campeonato Crypto</p>
        </div>

        <div class="journey-container" id="journey-map">
            <div class="tactic-line"></div>
            <!-- Gerado via JS -->
        </div>

        <button onclick="resetProgress()" class="my-10 text-white/20 text-[9px] uppercase tracking-widest font-bold">
            Resetar Carreira
        </button>
    </div>
</div>

<script>
    const matchData = [
        { name: "Brasil", code: "br" }, { name: "Argentina", code: "ar" },
        { name: "França", code: "fr" }, { name: "Alemanha", code: "de" },
        { name: "Espanha", code: "es" }, { name: "Itália", code: "it" },
        { name: "Inglaterra", code: "gb" }, { name: "Portugal", code: "pt" },
        { name: "Holanda", code: "nl" }, { name: "Bélgica", code: "be" },
        { name: "Uruguai", code: "uy" }, { name: "Croácia", code: "hr" }
    ];

    let userProgress = 1;

    function renderMap() {
        const mapContainer = document.getElementById('journey-map');
        mapContainer.querySelectorAll('.level-wrapper').forEach(n => n.remove());

        matchData.forEach((match, index) => {
            const levelNum = index + 1;
            const wrapper = document.createElement('div');
            
            let statusClass = (levelNum < userProgress) ? 'level-unlocked' : 
                              (levelNum === userProgress) ? 'level-current' : 'level-locked';

            let posClass = (levelNum % 4 === 1) ? 'node-left' : 
                           (levelNum % 4 === 3) ? 'node-right' : 'node-center';

            wrapper.className = `level-wrapper ${statusClass} ${posClass}`;
            wrapper.style.top = `${index * 130 + 40}px`;

            wrapper.innerHTML = `
                <div class="level-node" 
                     style="background-image: url('https://flagcdn.com/w160/${match.code}.png')"
                     onclick="startLevel(${levelNum})">
                </div>
                <div class="level-info">
                    <div class="level-title">Partida</div>
                    <div class="level-number">${levelNum}</div>
                </div>
            `;
            mapContainer.appendChild(wrapper);
        });
    }

    function startLevel(lvl) {
        if (lvl > userProgress) return;
        alert(`Partida ${lvl} contra ${matchData[lvl-1].name}`);
        if(lvl === userProgress && userProgress < 12) {
            userProgress++;
            renderMap();
        }
    }

    function resetProgress() {
        if(confirm("Reiniciar campeonato?")) {
            userProgress = 1;
            renderMap();
        }
    }

    window.onload = renderMap;
</script>

</body>
</html>
